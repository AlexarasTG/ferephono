[package]
name = "ferephono"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
cpal = "0.16"
enigo = "0.6"
hound = "3.5"
ignore = "0.4.33"
log = "0.4"
notify-debouncer-full = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
av-foundation = "0.8"
core-foundation = "0.10"
core-graphics = "0.25"
dispatch2 = "0.3"
macos-accessibility-client = "0.0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSOpenPanel", "NSSavePanel", "NSColor", "NSGraphics", "NSScreen", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
