[package]
name = "floating-whisprer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
cpal = "0.16"
enigo = "0.6"
hound = "3.5"
log = "0.4"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
av-foundation = "0.8"
macos-accessibility-client = "0.0.2"
